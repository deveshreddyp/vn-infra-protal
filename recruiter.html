<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Dashboard - VN Infra</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }
        body.dark {
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --border: #334155;
        }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        
        .header { background: var(--surface); padding: 1rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .brand { font-weight: bold; font-size: 1.2rem; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        
        .layout { max-width: 1200px; margin: 2rem auto; display: grid; grid-template-columns: 250px 1fr; gap: 2rem; padding: 0 1rem; }
        
        .card { background: var(--surface); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .card h2 { margin-top: 0; color: var(--primary); font-size: 1.25rem; }
        
        .btn { background: var(--primary); color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }
        .btn:hover { opacity: 0.9; }
        .btn-sec { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-del { background: #ef4444; color: white; padding: 0.2rem 0.6rem; font-size: 0.8rem; }
        
        input, textarea, select { width: 100%; padding: 0.5rem; margin: 0.5rem 0 1rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); box-sizing: border-box; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: var(--bg); font-weight: 600; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 100; }
        .modal.open { display: flex; }
        .modal-content { background: var(--surface); padding: 2rem; border-radius: 12px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; position: relative; }
        .close { position: absolute; top: 1rem; right: 1rem; font-size: 1.5rem; cursor: pointer; }
        
        .status-badge { padding: 0.25rem 0.5rem; border-radius: 999px; font-size: 0.85rem; font-weight: 500; }
        .status-Shortlisted { background: #dcfce7; color: #166534; }
        .status-Pending { background: #f1f5f9; color: #475569; }
        .status-Rejected { background: #fee2e2; color: #991b1b; }
        
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        .stat-box { background: var(--bg); padding: 1rem; border-radius: 8px; text-align: center; }
        .stat-num { font-size: 1.5rem; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

<div class="header">
    <div class="brand">VN Infra Reality</div>
    <div>
        <button class="btn btn-sec" id="theme-toggle">Toggle Dark Mode</button>
        <a href="index.html" class="btn btn-sec" style="text-decoration:none; margin-left:10px;">Logout</a>
    </div>
</div>

<div class="layout">
    <aside>
        <div class="card">
            <h3>Menu</h3>
            <p><a href="#overview" style="text-decoration:none; color:var(--text);">📊 Overview</a></p>
            <p><a href="#apps" style="text-decoration:none; color:var(--text);">📁 Applications</a></p>
            <p><a href="#jobs" style="text-decoration:none; color:var(--text);">📌 Manage Jobs</a></p>
        </div>
    </aside>

    <main>
        <div id="overview" class="card">
            <h2>Overview</h2>
            <div class="stats">
                <div class="stat-box">Total Apps<div class="stat-num" id="stat-total">0</div></div>
                <div class="stat-box">Shortlisted<div class="stat-num" id="stat-short">0</div></div>
                <div class="stat-box">Avg Score<div class="stat-num" id="stat-avg">0%</div></div>
            </div>
        </div>

        <div id="apps" class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2>Applications</h2>
                <button class="btn btn-sec" onclick="loadData()">Refresh</button>
            </div>
            <table>
                <thead>
                    <tr><th>Name</th><th>Job</th><th>Score</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="app-table"></tbody>
            </table>
        </div>

        <div id="jobs" class="card">
            <h2>Post a Job</h2>
            <form onsubmit="addJob(event)">
                <input id="job-title" placeholder="Job Title (e.g. Site Engineer)" required>
                <textarea id="job-desc" placeholder="Job Description..." required></textarea>
                <button class="btn">Post Job</button>
            </form>
        </div>
    </main>
</div>

<div class="modal" id="detail-modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="m-name">Candidate Name</h2>
        <p id="m-summary"></p>
        
        <h3>Status</h3>
        <div style="display:flex; gap:10px;">
            <select id="m-status">
                <option value="Pending">Pending</option>
                <option value="Shortlisted">Shortlisted</option>
                <option value="Interviewing">Interviewing</option>
                <option value="Rejected">Rejected</option>
            </select>
            <button class="btn" onclick="updateStatus()">Update</button>
        </div>

        <h3>Notes</h3>
        <textarea id="m-notes" placeholder="Recruiter notes..."></textarea>
        <button class="btn btn-sec" onclick="updateNotes()">Save Note</button>

        <h3>Matching Skills</h3>
        <ul id="m-matching"></ul>
        <h3>Missing Skills</h3>
        <ul id="m-missing"></ul>
        <h3>Interview Questions</h3>
        <ul id="m-questions"></ul>
    </div>
</div>

<script>
    const API = "https://vn-infra-protal-1.onrender.com"; // UPDATE IF DEPLOYED
    let currentId = null;

    async function loadData() {
        // 1. Get Analytics
        const ana = await fetch(`${API}/get-analytics`).then(r => r.json());
        document.getElementById('stat-total').innerText = ana.total_apps;
        document.getElementById('stat-short').innerText = ana.total_shortlisted;
        document.getElementById('stat-avg').innerText = ana.avg_score + '%';

        // 2. Get Apps
        const res = await fetch(`${API}/get-applications`);
        const data = await res.json();
        const tbody = document.getElementById('app-table');
        tbody.innerHTML = '';

        (data.applications || []).forEach(app => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="color:var(--primary); cursor:pointer; font-weight:bold;" 
                    onclick='openModal(${JSON.stringify(app).replace(/'/g, "&#39;")})'>
                    ${app.name}
                </td>
                <td>${app.jobTitle || 'N/A'}</td>
                <td>${app.score}%</td>
                <td><span class="status-badge status-${app.status}">${app.status}</span></td>
                <td><button class="btn btn-del" onclick="deleteApp('${app.filename}')">Delete</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function openModal(app) {
        currentId = app.id;
        document.getElementById('m-name').innerText = `${app.name} (${app.score}%)`;
        document.getElementById('m-summary').innerText = app.summary || 'No summary available.';
        document.getElementById('m-status').value = app.status;
        document.getElementById('m-notes').value = app.notes || '';

        const renderList = (id, arr) => {
            const el = document.getElementById(id);
            el.innerHTML = '';
            if(!arr || arr.length===0) el.innerHTML = '<li>None</li>';
            else arr.forEach(i => el.innerHTML += `<li>${i}</li>`);
        }

        renderList('m-matching', app.matchingSkills);
        renderList('m-missing', app.missingSkills);
        renderList('m-questions', app.interviewQuestions);

        document.getElementById('detail-modal').classList.add('open');
    }

    function closeModal() {
        document.getElementById('detail-modal').classList.remove('open');
    }

    async function updateStatus() {
        const status = document.getElementById('m-status').value;
        await fetch(`${API}/update-status`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ id: currentId, status })
        });
        alert('Status Updated');
        loadData();
    }

    async function updateNotes() {
        const notes = document.getElementById('m-notes').value;
        await fetch(`${API}/update-notes`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ id: currentId, notes })
        });
        alert('Notes Saved');
    }

    async function deleteApp(filename) {
        if(!confirm('Delete this application?')) return;
        await fetch(`${API}/delete-application/${filename}`, { method:'DELETE' });
        loadData();
    }

    async function addJob(e) {
        e.preventDefault();
        const title = document.getElementById('job-title').value;
        const desc = document.getElementById('job-desc').value;
        await fetch(`${API}/add-job`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ title, description: desc })
        });
        alert('Job Posted!');
        e.target.reset();
    }

    // Theme Toggle
    document.getElementById('theme-toggle').onclick = () => {
        document.body.classList.toggle('dark');
    };

    // Initial Load
    loadData();
</script>
</body>
</html>
