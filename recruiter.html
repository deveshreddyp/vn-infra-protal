<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Dashboard</title>
    <style>
        :root { --primary: #2563eb; --bg: #f3f4f6; --surface: #fff; --text: #0f172a; }
        body.dark { --bg: #0f172a; --surface: #1e293b; --text: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        
        .header { background: var(--surface); padding: 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
        .container { display: grid; grid-template-columns: 250px 1fr; gap: 2rem; max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        
        .card { background: var(--surface); padding: 1.5rem; border-radius: 8px; margin-bottom: 1rem; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn { background: var(--primary); color: white; padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; }
        .btn-del { background: #dc2626; font-size: 0.8rem; padding: 0.3rem 0.6rem; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.8rem; text-align: left; border-bottom: 1px solid #eee; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal.open { display: flex; }
        .modal-content { background: var(--surface); padding: 2rem; border-radius: 8px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; position: relative; }
        .close { position: absolute; top: 1rem; right: 1rem; font-size: 1.5rem; cursor: pointer; }
        
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; text-align: center; }
        .stat-num { font-size: 1.5rem; font-weight: bold; color: var(--primary); }
        
        input, textarea, select { width: 100%; padding: 0.5rem; margin-bottom: 1rem; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="header">
    <h2>VN Infra Reality</h2>
    <div>
        <button class="btn" onclick="document.body.classList.toggle('dark')">Dark Mode</button>
        <a href="index.html" class="btn" style="text-decoration: none; background: #64748b;">Logout</a>
    </div>
</div>

<div class="container">
    <aside>
        <div class="card">
            <h3>Menu</h3>
            <p>📊 Overview</p>
            <p>📁 Applications</p>
            <p>📌 Post Job</p>
        </div>
    </aside>
    
    <main>
        <div class="card">
            <h3>Overview</h3>
            <div class="stats">
                <div>Total Apps <div class="stat-num" id="stat-total">0</div></div>
                <div>Shortlisted <div class="stat-num" id="stat-short">0</div></div>
                <div>Avg Score <div class="stat-num" id="stat-avg">0%</div></div>
            </div>
        </div>
        
        <div class="card">
            <div style="display:flex; justify-content:space-between;">
                <h3>Applications</h3>
                <button class="btn" onclick="loadData()">Refresh</button>
            </div>
            <table>
                <thead><tr><th>Name</th><th>Job</th><th>Score</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="app-table"></tbody>
            </table>
        </div>
        
        <div class="card">
            <h3>Post Job</h3>
            <form onsubmit="postJob(event)">
                <input id="job-title" placeholder="Title" required>
                <textarea id="job-desc" placeholder="Description" required></textarea>
                <button class="btn">Add Job</button>
            </form>
        </div>
    </main>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close" onclick="document.getElementById('modal').classList.remove('open')">&times;</span>
        <h2 id="m-name">Name</h2>
        <p id="m-summary"></p>
        
        <h3>Update Status</h3>
        <div style="display:flex; gap: 10px;">
            <select id="m-status">
                <option value="Pending">Pending</option>
                <option value="Shortlisted">Shortlisted</option>
                <option value="Rejected">Rejected</option>
            </select>
            <button class="btn" onclick="updateStatus()">Update</button>
        </div>
        
        <h3>Notes</h3>
        <textarea id="m-notes"></textarea>
        <button class="btn" onclick="saveNote()">Save Note</button>
        
        <h3>Matching Skills</h3>
        <ul id="m-match"></ul>
        <h3>Missing Skills</h3>
        <ul id="m-miss"></ul>
        <h3>Interview Questions</h3>
        <ul id="m-ques"></ul>
    </div>
</div>

<script>
    const API = 'https://vn-infra-protal-1.onrender.com';
    let currentId = null;

    async function loadData() {
        // Analytics
        const ana = await fetch(`${API}/get-analytics`).then(r=>r.json());
        document.getElementById('stat-total').innerText = ana.total_apps;
        document.getElementById('stat-short').innerText = ana.total_shortlisted;
        document.getElementById('stat-avg').innerText = ana.avg_score + '%';
        
        // Apps
        const res = await fetch(`${API}/get-applications`);
        const data = await res.json();
        const tbody = document.getElementById('app-table');
        tbody.innerHTML = '';
        
        (data.applications || []).forEach(app => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="color: blue; cursor: pointer; font-weight: bold;" onclick='openModal(${JSON.stringify(app).replace(/'/g, "&#39;")})'>${app.name}</td>
                <td>${app.jobTitle || 'N/A'}</td>
                <td>${app.score}%</td>
                <td>${app.status}</td>
                <td><button class="btn btn-del" onclick="deleteApp('${app.filename}')">Delete</button></td>
            `;
            tbody.appendChild(tr);
        });
    }
    
    function openModal(app) {
        currentId = app.id;
        document.getElementById('m-name').innerText = `${app.name} (${app.score}%)`;
        document.getElementById('m-summary').innerText = app.summary || 'No summary.';
        document.getElementById('m-status').value = app.status;
        document.getElementById('m-notes').value = app.notes || '';
        
        const fillList = (id, arr) => {
            const el = document.getElementById(id);
            el.innerHTML = '';
            if(!arr || arr.length===0) el.innerHTML = '<li>None</li>';
            else arr.forEach(x => el.innerHTML += `<li>${x}</li>`);
        }
        fillList('m-match', app.matchingSkills);
        fillList('m-miss', app.missingSkills);
        fillList('m-ques', app.interviewQuestions);
        
        document.getElementById('modal').classList.add('open');
    }
    
    async function deleteApp(fname) {
        if(confirm('Delete?')) {
            await fetch(`${API}/delete-application/${fname}`, {method:'DELETE'});
            loadData();
        }
    }
    
    async function updateStatus() {
        await fetch(`${API}/update-status`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({id: currentId, status: document.getElementById('m-status').value})
        });
        alert('Updated!');
        loadData();
    }
    
    async function saveNote() {
        await fetch(`${API}/update-notes`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({id: currentId, notes: document.getElementById('m-notes').value})
        });
        alert('Saved!');
    }
    
    async function postJob(e) {
        e.preventDefault();
        await fetch(`${API}/add-job`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({title: document.getElementById('job-title').value, description: document.getElementById('job-desc').value})
        });
        alert('Job Added');
        e.target.reset();
    }
    
    loadData();
</script>
</body>
</html>
